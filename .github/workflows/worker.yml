# Generierungs-Worker auf GitHub Actions.
#
# Warum hier und nicht als Daemon: die Pipeline braucht einen echten Browser
# (Playwright für Notecheck und Render-Audit), damit fallen die üblichen
# Funktions-Hoster weg. Öffentliche Repos laufen auf Standard-Runnern ohne
# Minutenkontingent, und ein Lauf dauert ohnehin Minuten — auf eine Sekunde
# Startzeit kommt es bei diesem Auftrag nicht an.
#
# Der Worker läuft hier in der Betriebsart „einmalig": Queue abarbeiten, dann
# enden. Bricht ein Lauf mittendrin ab, gibt `requeueStale()` den Job nach 30
# Minuten wieder frei — kein Auftrag geht verloren, er wartet nur.
name: Lektionen bauen

on:
  # Aus der App bzw. per Datenbank-Hook, sobald ein Auftrag entsteht — der
  # normale Weg, der einen neuen Auftrag ohne Wartezeit aufgreift.
  repository_dispatch:
    types: [generation-job]
  # Von Hand, mit Knopf in der Actions-Oberfläche.
  workflow_dispatch:
  # Sicherheitsnetz: fängt Aufträge, deren Hook nicht angekommen ist. Der Plan
  # ist eine Bitte, kein Termin — GitHub verschiebt Läufe unter Last. Genau
  # deshalb ist er das Netz und nicht der Weg.
  schedule:
    - cron: "*/15 * * * *"

# Zwei Läufe gleichzeitig wären nicht falsch (claim_next_job greift per
# FOR UPDATE SKIP LOCKED), aber sie verdoppeln die Modell-Kosten ohne Nutzen.
# Ein laufender Lauf wird NICHT abgebrochen — er hat einen Auftrag in der Hand.
concurrency:
  group: lektionen-bauen
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    # Ein einzelner Auftrag darf 30 Minuten dauern (PIPELINE_TIMEOUT_MS), und der
    # Worker prüft seinen Deckel erst zwischen Aufträgen — 45 Minuten lassen einen
    # laufenden Auftrag zu Ende kommen, ohne dass ein Hänger eine Stunde frisst.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: "22"
          cache: npm

      - name: Abhängigkeiten
        timeout-minutes: 10
        run: npm ci

      # Nur Chromium: die Pipeline zeichnet damit, Firefox und WebKit wären
      # Ladezeit ohne Zweck.
      #
      # ⚠️ Aus dem ersten Echtlauf, der hier 53 Minuten stillstand: `--with-deps`
      # ruft `apt-get`, und dessen Paketquelle (azure.archive.ubuntu.com) hing —
      # letzte Log-Zeile 19:35:59, danach nichts mehr. Kein Fehler, keine Ausgabe,
      # kein Abbruch: apt wartet auf einen Server, der nicht antwortet.
      #
      # Das `timeout` gehört deshalb um den BEFEHL und nicht nur an den Schritt:
      # ein Schritt-Zeitlimit bricht den ganzen Schritt ab, dann läuft der
      # Rückfall nie. So bekommt der zweite Versuch seine Chance — und der kommt
      # ohne apt aus, weil die Systembibliotheken auf ubuntu-latest ohnehin
      # meist liegen. `timeout-minutes` bleibt als äußere Reißleine stehen.
      - name: Browser
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          timeout 360 npx playwright install --with-deps chromium || {
            echo "::warning::--with-deps kam nicht durch (Paketquelle?) — versuche ohne Systemlibs"
            npx playwright install chromium
          }

      - name: Queue abarbeiten
        # Der Deckel liegt UNTER dem 15-Minuten-Plan: sonst läuft der nächste
        # planmäßige Lauf in einen noch laufenden, die Sperrgruppe bricht ihn ab,
        # und der Plan ist faktisch wirkungslos. Beobachtet im Echtbetrieb —
        # zwei planmäßige Läufe hintereinander abgebrochen.
        timeout-minutes: 35
        env:
          WORKER_ONCE: "1"
          WORKER_MAX_MS: "720000" # 12 Minuten
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Ein Schlüssel für Generator UND Judge — beide laufen über OpenRouter
          # (worker/models.mjs). Die Schlüsseldatei jarvis/.env gibt es hier
          # nicht; loadKey nimmt deshalb die Umgebung.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node worker/index.mjs

      # Die Lauf-Artefakte (Dossier, Zwischenstände, Statistik) sind die einzige
      # Spur, wenn ein Auftrag scheitert — lokal liegen sie in worker/jobs/.
      - name: Lauf-Artefakte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-jobs-${{ github.run_id }}
          path: worker/jobs/
          retention-days: 7
          if-no-files-found: ignore
