<script src="renderer.js"></script>
<script>

// ————— App-Shell —————
const LESSONS = [LESSON_FREUD, LESSON_NAVAL, LESSON_HABITS, LESSON_KAHNEMAN, LESSON_SLEEP, LESSON_GLM, LESSON_GLM_V2];
const area = document.getElementById("cardarea");
const progress = document.getElementById("progress");
const cardindex = document.getElementById("cardindex");
const overlay = document.getElementById("jsonoverlay");
const jsoncode = document.getElementById("jsoncode");
const params = new URLSearchParams(location.search);
let lessonIdx = Math.min(LESSONS.length - 1, Math.max(0, (parseInt(params.get("lesson"), 10) || 1) - 1));
let LESSON = LESSONS[lessonIdx];
let N = LESSON.cards.length;
let idx = Math.min(N - 1, Math.max(0, (parseInt(params.get("card"), 10) || 1) - 1));

function buildProgress() {
  progress.innerHTML = LESSON.cards.map(() => "<span></span>").join("");
}
buildProgress();

function switchLesson(i) {
  lessonIdx = i;
  LESSON = LESSONS[i];
  N = LESSON.cards.length;
  idx = 0;
  buildProgress();
  document.querySelectorAll(".lessonbtn").forEach((b, bi) => b.classList.toggle("active", bi === i));
  render();
}
document.querySelectorAll(".lessonbtn").forEach((b, bi) => {
  b.classList.toggle("active", bi === lessonIdx);
  b.addEventListener("click", () => switchLesson(bi));
});

function render() {
  const card = LESSON.cards[idx];
  renderCardInto(area, card, { onAdvance: () => go(1) });
  [...progress.children].forEach((s, i) => s.classList.toggle("done", i <= idx));
  cardindex.textContent = `${idx + 1} / ${N}`;
  overlay.classList.remove("open");
}

function go(d) {
  idx = Math.min(N - 1, Math.max(0, idx + d));
  render();
}

area.addEventListener("click", (e) => {
  if (e.target.closest("button")) return;
  const r = area.getBoundingClientRect();
  go((e.clientX - r.left) / r.width < 0.35 ? -1 : 1);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") go(1);
  if (e.key === "ArrowLeft") go(-1);
});


document.getElementById("jsonbtn").addEventListener("click", () => {
  jsoncode.textContent = JSON.stringify(LESSON.cards[idx], null, 2);
  overlay.classList.add("open");
});
document.getElementById("jsonclose").addEventListener("click", () => overlay.classList.remove("open"));
document.querySelector(".xbtn").addEventListener("click", () => { idx = 0; render(); });

render();
</script>
